# Docker Compose for the reference agent app.
#
# Two services on their own ports: the FastAPI backend and the Streamlit
# frontend. The frontend reaches the backend by its compose service name
# (http://backend:8000) over the internal network — no host port is involved in
# service-to-service traffic.
#
# The Gemini service-account JSON is never baked into the image — it is mounted
# read-only from the gitignored ./credentials directory and located via
# GOOGLE_APPLICATION_CREDENTIALS.

services:
  backend:
    build: ./backend
    ports:
      # Host 8001 -> container 8000 (host 8000 is used by another local service).
      - "8001:8000"
    volumes:
      - ./credentials:/credentials:ro
    environment:
      # Path to the mounted service-account key (read by the Google SDK).
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/service-account-key.json
      # Notebook-matching defaults; override here if your GCP setup differs.
      GEMINI_MODEL: gemini-3.5-flash
      GCP_PROJECT: zen-general-377713
      GCP_LOCATION: global

  frontend:
    build: ./frontend
    ports:
      # Host 8501 -> container 8501 (Streamlit's default port).
      - "8501:8501"
    environment:
      # Reach the backend by its compose service name over the internal network.
      # Overrides the standalone default (http://localhost:8001) baked into app.py.
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
